<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Gear/cog wheel -->
  <g transform="translate(40,40)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#E8175D" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#E8175D" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="4" fill="#E8175D"/>
    <!-- Spokes -->
    <line x1="0" y1="-10" x2="0" y2="-22" stroke="#E8175D" stroke-width="3"/>
    <line x1="0" y1="10" x2="0" y2="22" stroke="#E8175D" stroke-width="3"/>
    <line x1="-10" y1="0" x2="-22" y2="0" stroke="#E8175D" stroke-width="3"/>
    <line x1="10" y1="0" x2="22" y2="0" stroke="#E8175D" stroke-width="3"/>
    <line x1="-7" y1="-7" x2="-15.5" y2="-15.5" stroke="#E8175D" stroke-width="3"/>
    <line x1="7" y1="7" x2="15.5" y2="15.5" stroke="#E8175D" stroke-width="3"/>
    <line x1="7" y1="-7" x2="15.5" y2="-15.5" stroke="#E8175D" stroke-width="3"/>
    <line x1="-7" y1="7" x2="-15.5" y2="15.5" stroke="#E8175D" stroke-width="3"/>
    <!-- Teeth -->
    <rect x="-4" y="-28" width="8" height="6" rx="1" fill="#E8175D"/>
    <rect x="-4" y="22" width="8" height="6" rx="1" fill="#E8175D"/>
    <rect x="-28" y="-4" width="6" height="8" rx="1" fill="#E8175D"/>
    <rect x="22" y="-4" width="6" height="8" rx="1" fill="#E8175D"/>
    <rect x="-21" y="-21" width="6" height="6" rx="1" fill="#E8175D" transform="rotate(45,-18,-18)"/>
    <rect x="15" y="-21" width="6" height="6" rx="1" fill="#E8175D" transform="rotate(45,18,-18)"/>
    <rect x="-21" y="15" width="6" height="6" rx="1" fill="#E8175D" transform="rotate(45,-18,18)"/>
    <rect x="15" y="15" width="6" height="6" rx="1" fill="#E8175D" transform="rotate(45,18,18)"/>
  </g>
  <!-- Text -->
  <text x="85" y="28" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#E8175D" letter-spacing="1">District 3141</text>
  <text x="83" y="54" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#E8175D">Rotaract</text>
</svg>
